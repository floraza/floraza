<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floraza 2030 - Farmers</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{display:flex;background:#f4f6f9;}

/* Sidebar */
.sidebar{
width:240px;height:100vh;background:#2e7d32;color:white;padding:20px;position:fixed;
}
.sidebar a{
display:block;color:white;text-decoration:none;margin:10px 0;padding:10px;border-radius:8px;
}
.sidebar a:hover{background:#1b5e20;}

.logo{
display:flex;align-items:center;gap:10px;margin-bottom:20px;
}
.logo img{width:40px;}

/* Main */
.main{margin-left:260px;padding:20px;width:100%;}

/* Header */
.header{
background:#388e3c;color:white;padding:15px;border-radius:10px;text-align:center;margin-bottom:20px;
}

/* Form */
.form{
background:white;padding:20px;border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);margin-bottom:20px;
display:flex;flex-wrap:wrap;gap:10px;
}

input,select{
padding:10px;border-radius:8px;border:1px solid #ccc;width:180px;
}

button{
background:#2e7d32;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;
}

/* Table */
.table-box{
background:white;padding:20px;border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

table{width:100%;border-collapse:collapse;}
th{background:#2e7d32;color:white;}
th,td{padding:10px;border:1px solid #ddd;text-align:center;}
img{border-radius:50%;}
</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">
<div class="logo">
<img src="../assets/logo.png">
<h3>Floraza 2030</h3>
</div>

<a href="dashboard.html">Dashboard</a> <a href="staff.html">Staff</a> <a href="farmers.html">Farmers</a> <a href="sales.html">Sales</a> <a href="delivery.html">Delivery</a> <a href="inventory.html">Inventory</a> <a href="incentives.html">Performance Incentives</a> <a href="activities.html">Activities</a> <a href="reports.html">Reports</a> <a href="#" onclick="logout()">Logout</a>

</div>

<!-- Main -->

<div class="main">

<div class="header">👨‍🌾 Farmer Management</div>

<!-- Form -->

<div class="form">

<input id="name" placeholder="Farmer Name">
<input id="phone" placeholder="Phone">
<input id="location" placeholder="Location">

<input id="acres" placeholder="Land (Acres)">
<input id="plants" placeholder="Plants" readonly>

<select id="staff"></select>

<input type="file" id="photo">

<button onclick="addFarmer()">Add Farmer</button>

</div>

<!-- Table -->

<div class="table-box">
<table>
<tr>
<th>ID</th>
<th>Photo</th>
<th>Name</th>
<th>Phone</th>
<th>Location</th>
<th>Acres</th>
<th>Plants</th>
<th>Staff</th>
</tr>
<tbody id="table"></tbody>
</table>
</div>

</div>

<script>

/* Protect */
if(localStorage.getItem("loggedIn")!=="true"){
window.location.href="../login.html";
}

/* Auto plants */
document.getElementById("acres").addEventListener("input", function(){
let acres = parseFloat(this.value) || 0;
document.getElementById("plants").value = acres * 300;
});

/* Load staff */
let staffList = JSON.parse(localStorage.getItem("staff")) || [];
let staffDropdown = document.getElementById("staff");

staffDropdown.innerHTML = "<option value=''>Select Staff</option>";

staffList.forEach(s=>{
staffDropdown.innerHTML += `<option value="${s.username}">${s.username}</option>`;
});

/* Add Farmer */
function addFarmer(){

let name = document.getElementById("name").value.trim();
let phone = document.getElementById("phone").value.trim();
let location = document.getElementById("location").value.trim();
let acres = parseFloat(document.getElementById("acres").value) || 0;
let plants = acres * 300;
let staff = document.getElementById("staff").value;
let file = document.getElementById("photo").files[0];

if(!name || !phone || !location){
alert("Fill all fields");
return;
}

if(!staff){
alert("Select staff");
return;
}

if(!file){
alert("Upload photo");
return;
}

let reader = new FileReader();

reader.onload = function(){

let farmers = JSON.parse(localStorage.getItem("farmers")) || [];

let id = "FRM" + String(farmers.length + 1).padStart(5,'0');

farmers.push({
id,
name,
phone,
location,
acres,
plants,
staff,
photo: reader.result
});

localStorage.setItem("farmers", JSON.stringify(farmers));

alert("Farmer added successfully");

loadFarmers();

/* Reset */
document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("location").value="";
document.getElementById("acres").value="";
document.getElementById("plants").value="";
document.getElementById("staff").value="";
document.getElementById("photo").value="";

};

reader.readAsDataURL(file);

}

/* Load Farmers */
function loadFarmers(){

let farmers = JSON.parse(localStorage.getItem("farmers")) || [];
let table = document.getElementById("table");

table.innerHTML="";

farmers.forEach(f=>{
table.innerHTML += `
<tr>
<td>${f.id}</td>
<td><img src="${f.photo}" width="40"></td>
<td>${f.name}</td>
<td>${f.phone}</td>
<td>${f.location}</td>
<td>${f.acres}</td>
<td>${f.plants}</td>
<td>${f.staff}</td>
</tr>
`;
});

}

loadFarmers();

/* Logout */
function logout(){
localStorage.clear();
window.location.href="../login.html";
}

</script>

</body>
</html>
