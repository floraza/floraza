<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floraza 2030 Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
display:flex;
height:100vh;
}

/* LEFT */
.left{
width:50%;
background:#2e7d32;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.left img{
width:150px;
margin-bottom:20px;
}

.left h1{font-size:32px;}
.left p{margin-top:10px;font-size:14px;}

/* RIGHT */
.right{
width:50%;
display:flex;
justify-content:center;
align-items:center;
background:#f4f6f9;
}

.login-box{
background:white;
padding:30px;
border-radius:15px;
width:320px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

.login-box h2{
text-align:center;
margin-bottom:20px;
color:#2e7d32;
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
outline:none;
}

.password-box{
position:relative;
}

.password-box span{
position:absolute;
right:10px;
top:14px;
cursor:pointer;
}

/* BUTTON */
button{
width:100%;
padding:12px;
background:#2e7d32;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

button:hover{
background:#1b5e20;
}

/* ERROR */
#error{
color:red;
text-align:center;
margin-top:10px;
font-size:14px;
}
</style>

</head>

<body>

<!-- LEFT -->

<div class="left">
<img src="assets/logo.png">
<h1>Floraza 2030</h1>
<p>Empowering Farmers. Growing Future.</p>
</div>

<!-- RIGHT -->

<div class="right">

<div class="login-box">

<h2>Login</h2>

<select id="role">
<option>Admin</option>
<option>Marketing</option>
<option>Staff</option>
</select>

<input id="username" placeholder="Username">

<div class="password-box">
<input id="password" type="password" placeholder="Password">
<span onclick="togglePass()">👁️</span>
</div>

<button onclick="login()">Login</button>

<p id="error"></p>

</div>

</div>

<script>

/* DEFAULT USERS */
if(!localStorage.getItem("users")){
localStorage.setItem("users", JSON.stringify([
{username:"admin",password:"1234",role:"Admin"},
{username:"marketing",password:"1234",role:"Marketing"}
]));
}

/* LOGIN FUNCTION */
function login(){

let role = document.getElementById("role").value;
let username = document.getElementById("username").value.trim();
let password = document.getElementById("password").value.trim();

if(!username || !password){
document.getElementById("error").innerText="Enter username and password";
return;
}

let users = JSON.parse(localStorage.getItem("users"));

let user = users.find(u =>
u.username===username &&
u.password===password &&
u.role===role
);

if(user){

localStorage.setItem("loggedIn","true");
localStorage.setItem("currentUser", JSON.stringify(user));

/* ROLE BASED REDIRECT */
if(role==="Admin"){
window.location.href="dashboard.html";
}else{
window.location.href="pages/user-dashboard.html";
}

}else{
document.getElementById("error").innerText="Invalid username or password";
}

}

/* SHOW / HIDE PASSWORD */
function togglePass(){
let p = document.getElementById("password");
p.type = p.type === "password" ? "text" : "password";
}

</script>

</body>
</html>
